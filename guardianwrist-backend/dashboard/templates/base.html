<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuardianWrist Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <nav class="bg-white shadow">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <a href="{% url 'dashboard:index' %}" class="text-xl font-bold text-blue-600">GuardianWrist Admin</a>
            <div>
                <span class="text-gray-600">Welcome, {{ user.username }}</span>
                <a href="{% url 'admin:logout' %}" class="ml-4 text-red-500">Logout</a>
            </div>
        </div>
    </nav>
    <main class="container mx-auto px-4 py-8">
        {% if messages %}
            {% for message in messages %}
                <div class="mb-4 p-4 rounded bg-green-100 text-green-800">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
