name: guardianwatch

description: "Guardian Watch wearable health and fitness platform."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # UI / Flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  intl: ^0.20.2
  fl_chart: ^1.2.0
  shimmer: ^3.0.0
  url_launcher: ^6.3.2

  # Firebase
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.3
  cloud_firestore: ^6.8.0

  # Authentication
  google_sign_in: ^7.2.0

  # Networking
  http: ^1.5.0

  # Security
  flutter_secure_storage: ^10.3.1

  # Bluetooth / Permissions
  flutter_blue_plus: ^2.3.9
  permission_handler: ^12.0.3

  # Local storage
  sqflite: ^2.4.3
  shared_preferences: ^2.3.0
  path: ^1.9.1

  # Device / identifiers
  uuid: ^4.5.3

  # Health platform
  health: ^13.3.1

  # Notifications / background
  flutter_local_notifications: ^22.0.1
  flutter_background_service: ^5.1.0

  # In-app purchases
  in_app_purchase: ^3.3.0

  # AI / ML
  tflite_flutter: ^0.12.1
  jni: ^1.0.0
  jni_flutter: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/models/
    - assets/splash/